<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#070913"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glowCyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgCyber)" stroke="url(#glowCyber)" stroke-width="12"/>

  <!-- Code / Web Window Icon -->
  <g transform="translate(66, 86)" stroke="url(#glowCyber)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glowEffect)">
    <!-- Browser Frame -->
    <rect x="20" y="20" width="340" height="260" rx="28"/>
    <line x1="20" y1="80" x2="360" y2="80"/>
    
    <!-- Dots -->
    <circle cx="60" cy="50" r="8" fill="#ff0055" stroke="none"/>
    <circle cx="95" cy="50" r="8" fill="#f59e0b" stroke="none"/>
    <circle cx="130" cy="50" r="8" fill="#10b981" stroke="none"/>

    <!-- Code brackets </> -->
    <path d="M140,140 L100,180 L140,220"/>
    <path d="M240,140 L280,180 L240,220"/>
    <line x1="205" y1="130" x2="175" y2="230"/>
  </g>
</svg>
